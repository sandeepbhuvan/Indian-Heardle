<div class="relative w-full mt-4">
  <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
    <!-- PrimeNG AutoComplete for Song Search -->
    <div class="flex-1">
      <p-autocomplete
        [ngModel]="selectedSong()"
        [suggestions]="suggestions()"
        (completeMethod)="searchSongs($event)"
        (onSelect)="selectSuggestion($event)"
        (onClear)="clearInput()"
        (keydown)="onKeyDown($event)"
        [disabled]="disabled()"
        optionLabel="formatted_label"
        placeholder="Know it? Search for artist, movie, or song title..."
        [style]="{'width':'100%'}"
        [inputStyle]="{'width':'100%'}"
        styleClass="w-full"
        inputStyleClass="w-full bg-slate-900/80 border-white/15 text-slate-100 placeholder:text-slate-500 rounded-xl py-2.5 px-4 text-sm focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20">
        
        <ng-template let-item pTemplate="item">
          <div class="flex items-center gap-3 py-1">
            <i class="pi pi-volume-up text-amber-400 text-sm"></i>
            <div class="flex flex-col overflow-hidden">
              <span class="text-sm font-bold text-slate-100 truncate">{{ item.title }}</span>
              <span class="text-xs text-slate-400 truncate">
                {{ item.artist }}
                @if (item.movie_or_album) {
                  <span class="text-slate-500">({{ item.movie_or_album }})</span>
                }
              </span>
            </div>
          </div>
        </ng-template>
      </p-autocomplete>
    </div>

    <!-- Action Buttons with PrimeNG -->
    <div class="flex gap-2 justify-end">
      <p-button 
        [label]="'Skip (+' + nextSnippetDuration() + 's)'"
        icon="pi pi-step-forward"
        severity="secondary"
        [disabled]="disabled()"
        (onClick)="onSkip()"
        styleClass="text-xs sm:text-sm font-bold rounded-xl" />
      
      <p-button 
        label="Submit" 
        icon="pi pi-check"
        severity="warn"
        [disabled]="disabled() || !selectedSong()"
        (onClick)="onSubmitGuess()"
        styleClass="text-xs sm:text-sm font-bold rounded-xl shadow-lg shadow-amber-500/25" />
    </div>
  </div>
</div>
