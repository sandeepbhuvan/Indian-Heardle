<div class="relative w-full mt-4">
  <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
    <!-- Custom AutoComplete for Song Search -->
    <div class="flex-1 relative" #autocompletewrapper>
      <input
        type="text"
        [value]="inputText()"
        (input)="onInputChange($event)"
        (keydown)="onKeyDown($event)"
        (focus)="onFocus()"
        (blur)="onBlur()"
        [disabled]="disabled()"
        placeholder="Know it? Search for artist, movie, or song title..."
        autocomplete="off"
        class="w-full bg-slate-900/80 border border-white/15 text-slate-100 placeholder:text-slate-500 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed" />

      <!-- Suggestions Dropdown -->
      @if (showDropdown() && suggestions().length > 0) {
        <div class="absolute z-50 left-0 right-0 top-full mt-1 bg-slate-900/98 border border-amber-500/30 rounded-xl overflow-hidden shadow-2xl backdrop-blur-xl">
          @for (item of suggestions(); track item.id; let i = $index) {
            <div
              (mousedown)="selectItem(item)"
              class="flex items-center gap-3 py-2.5 px-4 cursor-pointer transition-colors hover:bg-amber-500/15"
              [class.bg-amber-500/10]="i === activeIndex()">
              <i class="pi pi-volume-up text-amber-400 text-sm shrink-0"></i>
              <div class="flex flex-col overflow-hidden">
                <span class="text-sm font-bold text-slate-100 truncate">{{ item.title }}</span>
                <span class="text-xs text-slate-400 truncate">
                  {{ item.artist }}
                  @if (item.movie_or_album) {
                    <span class="text-slate-500"> ({{ item.movie_or_album }})</span>
                  }
                </span>
              </div>
            </div>
          }
        </div>
      }
    </div>

    <!-- Action Buttons -->
    <div class="flex gap-2 justify-end">
      <button
        (click)="onSkip()"
        [disabled]="disabled()"
        class="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-white/10 hover:bg-white/15 border border-white/10 text-slate-200 cursor-pointer transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="pi pi-step-forward text-xs"></i>
        Skip (+{{ nextSnippetDuration() }}s)
      </button>

      <button
        (click)="onSubmitGuess()"
        [disabled]="disabled() || !selectedSong()"
        class="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white shadow-lg shadow-amber-500/25 cursor-pointer transition-all disabled:opacity-50 disabled:cursor-not-allowed">
        <i class="pi pi-check text-xs"></i>
        Submit
      </button>
    </div>
  </div>
</div>
