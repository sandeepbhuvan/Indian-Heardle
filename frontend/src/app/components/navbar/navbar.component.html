<header class="w-full border-b border-white/10 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <!-- Logo & Title -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 flex items-center justify-center text-xl rounded-xl bg-gradient-to-br from-amber-500/20 to-pink-500/20 border border-amber-500/40 shadow-inner">
        🎵
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white m-0 leading-tight">
          INDIAN <span class="bg-gradient-to-r from-amber-400 to-pink-500 bg-clip-text text-transparent">HEARDLE</span>
        </h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold m-0 hidden sm:block">
          Daily Musical Challenge
        </p>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-3 flex-wrap">
      <!-- PrimeNG Select Dropdown for Languages -->
      <p-select 
        [options]="languages()" 
        [ngModel]="selectedLanguage()" 
        (ngModelChange)="onLanguageChange($event)"
        optionLabel="display_name" 
        optionValue="code"
        placeholder="Select Language"
        styleClass="w-40 sm:w-48 text-xs font-semibold">
        <ng-template let-lang pTemplate="selectedItem">
          <span class="truncate">{{ lang.display_name }}</span>
        </ng-template>
        <ng-template let-lang pTemplate="item">
          <div class="flex items-center justify-between w-full gap-2">
            <span class="text-xs">{{ lang.display_name }}</span>
            <span class="text-[10px] text-slate-400 font-mono">{{ lang.native_name || lang.code }}</span>
          </div>
        </ng-template>
      </p-select>

      <!-- PrimeNG SelectButton for Mode Toggle -->
      <p-selectbutton 
        [options]="modeOptions" 
        [ngModel]="gameMode()" 
        (ngModelChange)="modeChange.emit($event)"
        optionLabel="label" 
        optionValue="value">
      </p-selectbutton>

      <!-- Action Buttons -->
      <div class="flex gap-1.5">
        <p-button 
          icon="pi pi-question-circle" 
          [rounded]="true" 
          [text]="true" 
          severity="secondary"
          (onClick)="openHelp.emit()" 
          title="How to Play" />
        
        <p-button 
          icon="pi pi-chart-bar" 
          [rounded]="true" 
          [text]="true" 
          severity="secondary"
          (onClick)="openStats.emit()" 
          title="Statistics" />
      </div>
    </div>
  </div>
</header>
