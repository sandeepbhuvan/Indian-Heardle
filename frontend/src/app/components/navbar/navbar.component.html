<header class="w-full border-b border-white/10 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
  <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
    <!-- Logo & Title -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 flex items-center justify-center text-xl rounded-xl bg-gradient-to-br from-amber-500/20 to-pink-500/20 border border-amber-500/40 shadow-inner">
        🎵
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white m-0 leading-tight">
          INDIAN <span class="bg-gradient-to-r from-amber-400 to-pink-500 bg-clip-text text-transparent">HEARDLE</span>
        </h1>
        <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold m-0 hidden sm:block">
          Daily Musical Challenge
        </p>
      </div>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-3 flex-wrap">
      <!-- Native Select Dropdown for Languages -->
      <div class="relative">
        <select
          [ngModel]="selectedLanguage()"
          (ngModelChange)="onLanguageChange($event)"
          class="appearance-none w-40 sm:w-48 text-xs font-semibold bg-slate-900/90 border border-white/15 text-slate-100 rounded-xl px-3 py-2 pr-8 cursor-pointer focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 transition-all">
          @for (lang of languages(); track lang.code) {
            <option [value]="lang.code">{{ lang.display_name }}</option>
          }
        </select>
        <span class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">▾</span>
      </div>

      <!-- Custom Mode Toggle (Daily / Practice) -->
      <div class="flex bg-black/40 border border-white/10 rounded-lg p-0.5 gap-0.5">
        @for (opt of modeOptions; track opt.value) {
          <button
          (click)="emitMode(opt.value)"
            class="text-xs font-bold px-3 py-1.5 rounded-md transition-all cursor-pointer"
            [class.bg-gradient-to-r]="gameMode() === opt.value"
            [class.from-amber-500]="gameMode() === opt.value"
            [class.to-orange-600]="gameMode() === opt.value"
            [class.text-white]="gameMode() === opt.value"
            [class.shadow-sm]="gameMode() === opt.value"
            [class.text-slate-400]="gameMode() !== opt.value"
            [class.hover:text-slate-200]="gameMode() !== opt.value">
            {{ opt.label }}
          </button>
        }
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-1.5">
        <button
          (click)="openHelp.emit()"
          title="How to Play"
          class="w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-all cursor-pointer border border-transparent hover:border-white/10">
          <i class="pi pi-question-circle text-base"></i>
        </button>

        <button
          (click)="openStats.emit()"
          title="Statistics"
          class="w-9 h-9 flex items-center justify-center rounded-full text-slate-400 hover:text-white hover:bg-white/10 transition-all cursor-pointer border border-transparent hover:border-white/10">
          <i class="pi pi-chart-bar text-base"></i>
        </button>
      </div>
    </div>
  </div>
</header>
